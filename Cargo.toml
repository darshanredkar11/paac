[workspace]
resolver = "2"
members = [
    "crates/authz-core",
    "crates/authz-policy",
    "crates/authz-identity",
    "crates/authz-suggest",
    "crates/authz-gateway",
    "crates/authz-cli",
    "crates/authz-board",
    "crates/authz-llm-bridge",
]
default-members = [
    "crates/authz-core",
    "crates/authz-policy",
    "crates/authz-identity",
    "crates/authz-suggest",
    "crates/authz-gateway",
    "crates/authz-cli",
    "crates/authz-board",
    "crates/authz-llm-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["PAAC Contributors"]
repository = "https://github.com/example/paac"
description = "Portable Agent Authorization Control Plane"

[workspace.dependencies]
authz-core = { path = "crates/authz-core" }
authz-policy = { path = "crates/authz-policy" }
authz-identity = { path = "crates/authz-identity" }
authz-suggest = { path = "crates/authz-suggest" }
authz-board = { path = "crates/authz-board" }
authz-llm-bridge = { path = "crates/authz-llm-bridge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
cedar-policy = "4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonwebtoken = "9"
async-trait = "0.1"
parking_lot = "0.12"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
